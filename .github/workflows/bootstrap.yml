name: Bootstrap DeutschMate Next.js platform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deutschmate
          cat .bootstrap/payload-* | base64 --decode > /tmp/deutschmate.tar.xz
          tar -xJf /tmp/deutschmate.tar.xz -C /tmp/deutschmate

          rsync -a --delete             --exclude='.git'             --exclude='LICENSE'             --exclude='.github/workflows/bootstrap.yml'             /tmp/deutschmate/ ./

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit complete Next.js platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build DeutschMate A1-C1 learning platform"
          git push origin HEAD:main
